
<html>
<head>
    <title>Registration Form</title>
</head>

<body>
    <h2>PATIENT REGISTRATION FORM</h2>

    <form>

        <label>Full Name:</label>
        <input type="text" name="fullname">
        <br><br>
        <label>Email:</label>
        <input type="email" name="email">
        <br><br>
        <label>ID number:</label>
        <input type ="id"name="id ">
        <br><br>
        <label>Phone Number:</label>
        <input type="tel" name="phone">
        <br><br>
        <label>patient number:</label>
        <input type="patient no"name="patient no"
        <br><br>
        <label>Date of Birth:</label>
        <input type="date" name="dob">
        <br><br>

        <label>Gender:</label>
        <input type="radio" name="gender" value="male"> Male
        <input type="radio" name="gender" value="female"> Female
        <br><br>
        <label>marital status:</label>
        <input type="radio"name="marital status"value="married">married 
        <input type ="radio"name="marital status"value="single">single 
        <br><br>
        <input type ="radio"name="health status"value ="with disability">with disability 
        <input type ="radio"name="health status"value ="without disability">without disability 
        <br><br>
        <label>next of kin</label>
        <input type ="next of kin"name="next of kin">
        <br><br>
        <label>weight:</label>
        <input type="weight" name="weight">
        <br><br>

      

        <input type="checkbox" name="conditions">
        registered successfully 
        <br><br>

        <input type="submit" value="Register">
        <input type="reset" value="Clear">

    </form>

</body>
</html>
