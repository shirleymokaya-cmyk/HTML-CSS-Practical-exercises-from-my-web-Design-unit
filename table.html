<html> 
 <head>
 <title>Tables</title>   
  <style>
  table{
      border:3px solid purple;
      border-spacing: spacing;
  }
  th,td{
  border:1px solid purple;
  padding:10px;
  }
  </style>
  </head>
  <body>
      <table>
   <caption> <b>       
  Timetable     
  </b> </caption>   
   <tr>    
   <th scope="col">Day/Time</th>  
    <th>9am</th>    
   <th>10am</th>  
   <th>11am</th>         
   <th>12pm</th>      
    </tr>       
    <tr>        
    <th scope="row">Monday</th>
    <td colspan="2">CIS 210</td>         
    <td>CIS 211</td>         
    <td>CIS 212</td>                
    </tr>      
     <tr>        
    <th scope="row">Tuesday</th>
    <td>CIS 122</td>
    <td>CIS 133</td>      
    <td colspan="2">CIS 213</td>      
     </tr>     
     </table>   
     </body>  
      </html>
